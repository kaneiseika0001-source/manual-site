<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06c755">
  <title>ご意見・改善案</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #26332c; background: #f4f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px 16px; }
    main { max-width: 520px; margin: 0 auto; padding: 24px; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px #19332212; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .intro { margin: 0 0 22px; padding: 16px; border-radius: 12px; background: #f3f7f4; color: #46534b; line-height: 1.8; }
    .intro-title { margin: 0 0 12px; color: #26332c; font-weight: 750; }
    .intro p { margin: 0 0 12px; }
    .intro p:last-child { margin-bottom: 0; }
    label, legend { display: block; margin: 18px 0 8px; font-weight: 650; }
    input[type="text"], textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5ce; border-radius: 9px; background: #fff; color: inherit; font: inherit; }
    textarea { min-height: 150px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: 2px solid #06c755; border-color: transparent; }
    .anonymous { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 400; }
    .anonymous input { width: 18px; height: 18px; accent-color: #06c755; }
    button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 28px; background: #06c755; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 1.5em; margin: 14px 0 0; color: #526058; text-align: center; line-height: 1.6; }
    #status.error { color: #b42318; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>ご意見・改善案</h1>
    <section class="intro" aria-label="ご意見を送る際の案内">
      <p class="intro-title">あなたのご意見・ご要望をお聞かせください！</p>
      <p>「こうしたらもっと良くなるかも」<br>「ちょっと困っている…」<br>どんな小さなことでも構いません。</p>
      <p>📝 回答は何度でも送信できます。<br>匿名でも大丈夫です 👌</p>
      <p>いただいたご意見は、より良い職場づくりのために活用させていただきます。</p>
      <p>🔒 送信内容が周囲の方に知られることはありませんので、安心して率直なご意見をお聞かせください。</p>
    </section>

    <form id="feedbackForm" class="hidden">
      <label for="senderName">名前</label>
      <input id="senderName" name="name" type="text" autocomplete="name" maxlength="80" required>
      <label class="anonymous"><input id="anonymous" type="checkbox">匿名で送信する</label>

      <label for="opinion">ご意見・改善案</label>
      <textarea id="opinion" name="opinion" maxlength="2000" required placeholder="ご意見・改善案を入力してください"></textarea>

      <label for="replyFormat">返答の希望形式</label>
      <select id="replyFormat" name="replyFormat" required>
        <option value="" selected disabled>選択してください</option>
        <option>LINEで返信</option>
        <option>口頭で説明</option>
        <option>返答不要</option>
      </select>

      <button id="submitButton" type="submit">送信する</button>
    </form>
    <p id="status" role="status" aria-live="polite">LINEを確認しています…</p>
  </main>

  <script>
    // ご意見フォーム専用LIFFアプリのIDに差し替えてください。
    const LIFF_ID = '2011627592-Oq3xeQpK';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx5LX8LjX98z1pi_Jmmav9GPWqjZybsaOKq_vKed1-xezrKxJNvCv4SOwjFteg5MEY0/exec';

    const form = document.getElementById('feedbackForm');
    const status = document.getElementById('status');
    const nameInput = document.getElementById('senderName');
    const anonymousInput = document.getElementById('anonymous');
    const submitButton = document.getElementById('submitButton');
    let accessToken = '';
    let verifiedName = '';

    function setStatus(message, isError) {
      status.textContent = message;
      status.classList.toggle('error', !!isError);
    }

    function callGas(params) {
      return new Promise((resolve, reject) => {
        const callback = 'feedbackCb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
        const script = document.createElement('script');
        const timer = setTimeout(() => { cleanup(); reject(new Error('通信がタイムアウトしました')); }, 10000);
        function cleanup() { clearTimeout(timer); delete window[callback]; script.remove(); }
        window[callback] = data => { cleanup(); resolve(data); };
        script.onerror = () => { cleanup(); reject(new Error('GASに接続できませんでした')); };
        script.src = GAS_URL + '?' + new URLSearchParams({ ...params, callback });
        document.body.appendChild(script);
      });
    }

    anonymousInput.addEventListener('change', () => {
      nameInput.disabled = anonymousInput.checked;
      nameInput.required = !anonymousInput.checked;
      nameInput.value = anonymousInput.checked ? '匿名' : verifiedName;
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const opinion = document.getElementById('opinion').value.trim();
      if (!opinion) { setStatus('ご意見・改善案を入力してください。', true); return; }

      submitButton.disabled = true;
      setStatus('送信しています…');
      try {
        const result = await callGas({
          action: 'submitIdea',
          token: accessToken,
          name: anonymousInput.checked ? '匿名' : nameInput.value.trim(),
          opinion,
          replyFormat: document.getElementById('replyFormat').value
        });
        if (!result || !result.ok) throw new Error((result && result.error) || '送信できませんでした。');
        form.reset();
        form.classList.add('hidden');
        setStatus('送信しました。ご意見ありがとうございます。');
      } catch (error) {
        setStatus(error.message || '送信できませんでした。時間をおいて再度お試しください。', true);
        submitButton.disabled = false;
      }
    });

    (async () => {
      if (!LIFF_ID || LIFF_ID.startsWith('ここに')) {
        setStatus('LIFF IDを設定してください。', true);
        return;
      }
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }
        accessToken = liff.getAccessToken();
        if (!accessToken) throw new Error('LINEログイン情報を取得できませんでした。');

        const result = await callGas({ action: 'name', token: accessToken });
        if (!result || !result.ok || !result.name) {
          throw new Error('LINEのスタッフ登録を確認できませんでした。公式LINEに「登録 お名前」と送信してから、もう一度お試しください。');
        }
        verifiedName = result.name;
        nameInput.value = verifiedName;
        form.classList.remove('hidden');
        setStatus('');
      } catch (error) {
        setStatus(error.message || '画面を開けませんでした。LINEから再度お試しください。', true);
      }
    })();
  </script>
</body>
</html>
