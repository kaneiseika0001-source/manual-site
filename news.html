<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お知らせ</title>
<style>
  :root { --bg:#fff; --card:#fff; --text:#1f2a44; --sub:#6b7280; --accent:#3b6fd6; --border:#e7ebf3; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
         background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  #app { max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:40px; }

  header.top { display:flex; align-items:center; gap:10px; padding:14px 16px 8px; position:sticky; top:0;
               background:var(--bg); z-index:5; }
  header.top .back { font-size:24px; width:24px; text-align:center; cursor:pointer; visibility:hidden; }
  header.top .back.show { visibility:visible; }
  header.top h1 { font-size:16px; font-weight:700; margin:0; }

  .view { display:none; }
  .view.active { display:block; }
  .section { margin:6px 16px 18px; }
  .section h3 { font-size:15px; font-weight:800; margin:0 2px 10px; }
  .section h3 small { font-size:12px; font-weight:600; color:var(--sub); margin-left:6px; }

  .card { background:var(--card); border:1px solid var(--border); border-left:4px solid #888;
          border-radius:14px; padding:13px 14px; margin-bottom:10px; cursor:pointer; }
  .card.past { background:#f8f9fc; }
  .card.read { background:#f8f9fc; opacity:.65; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .sub-label { font-size:12px; font-weight:700; color:var(--sub); margin:14px 2px 8px; }
  .meta { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .chip { font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:8px; }
  .date { font-size:12px; color:var(--sub); }
  .badge-new { margin-left:auto; background:#e6483c; color:#fff; font-size:10px; font-weight:800;
               padding:3px 7px; border-radius:8px; flex-shrink:0; letter-spacing:.5px; }
  .card .t { font-size:14.5px; font-weight:800; margin:0 0 4px; line-height:1.5; }
  .card .pv { font-size:12.5px; color:var(--sub); margin:0; line-height:1.6;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  .toggle { display:block; width:100%; padding:13px; border-radius:12px; background:var(--card);
            border:1px solid var(--border); color:var(--accent); font-size:13.5px; font-weight:700; cursor:pointer; }
  #pastList { display:none; margin-top:10px; }

  .empty { text-align:center; color:var(--sub); font-size:13px; padding:28px 20px; }
  .state { text-align:center; margin-top:56px; padding:0 24px; }
  .state p { font-size:14px; color:var(--sub); line-height:1.8; margin:0; }
  .spinner { width:28px; height:28px; margin:0 auto 16px; border-radius:50%;
             border:3px solid var(--border); border-top-color:var(--accent); animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }
  .btn { display:inline-block; margin-top:18px; padding:12px 22px; border-radius:12px; background:var(--card);
         border:1px solid var(--border); color:var(--accent); font-size:13.5px; font-weight:700; cursor:pointer; text-decoration:none; }

  .detail-head { margin:4px 16px 16px; }
  .detail-title { font-size:19px; font-weight:800; margin:12px 0 4px; line-height:1.5; }
  .detail-date { font-size:12px; color:var(--sub); }
  .detail-body { margin:0 16px; background:var(--card); border:1px solid var(--border); border-radius:14px;
                 padding:16px; font-size:14px; line-height:1.9; white-space:pre-wrap; word-break:break-word; }
  .detail-image { margin:16px 16px 0; border-radius:14px; overflow:hidden; }
  .detail-image img { width:100%; display:block; }
  .detail-actions { margin:12px 16px 0; }
  .detail-actions a { display:flex; justify-content:center; padding:13px; border-radius:12px; background:var(--card);
                      border:1px solid var(--border); font-size:13.5px; font-weight:700; color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="back" id="backBtn" onclick="goBack()">‹</span>
    <h1 id="title">お知らせ</h1>
  </header>

  <div class="view active" id="view-loading">
    <div class="state"><div class="spinner"></div><p>読み込み中です…</p></div>
  </div>

  <div class="view" id="view-error">
    <div class="state"><p id="errText">読み込めませんでした。<br>電波の良い場所で、もう一度お試しください。</p>
      <a class="btn" href="#" onclick="load(); return false;">もう一度読み込む</a></div>
  </div>

  <div class="view" id="view-list">
    <div class="section">
      <h3>現在のお知らせ<small id="curCount"></small></h3>
      <div id="curList"></div>
    </div>
    <div class="section" id="pastSection">
      <button class="toggle" id="pastBtn" onclick="togglePast()"></button>
      <div id="pastList"></div>
    </div>
  </div>

  <div class="view" id="view-detail">
    <div class="detail-head">
      <span class="chip" id="dChip"></span>
      <div class="detail-title" id="dTitle"></div>
      <div class="detail-date" id="dDate"></div>
    </div>
    <div class="detail-body" id="dBody"></div>
    <div class="detail-image" id="dImage" style="display:none;"></div>
    <div class="detail-actions" id="dActions"></div>
  </div>
</div>

<script>
  // お知らせ用GASのWebアプリURL(ルール・マニュアルと同じもの)
  const API_URL = 'https://script.google.com/macros/s/AKfycbzWeTxLPpf93T90hndtyNa64LnxBixU4aDj18Zw9VeUAWY6q0oksia3Fwkud_rgFfqYog/exec';

  var byId = {}, savedScroll = 0, pastOpen = false, pastCount = 0;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function fmt(d) { return d ? String(d).replace(/-/g, '/') : ''; }
  function colorOf(cat) {
    var m = { '重要なお知らせ':'#E6483C', '勤務・シフト':'#F0932B', '設備・環境':'#34A853', '業務連絡':'#4DA3FF' };
    return m[cat] || '#888888';
  }
  function show(name) {
    document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
    document.getElementById('view-' + name).classList.add('active');
    document.getElementById('backBtn').classList.toggle('show', name === 'detail');
  }

  function jsonp(url, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var cb = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      var script = document.createElement('script');
      var timer = setTimeout(function () { cleanup(); reject(new Error('timeout')); }, timeoutMs || 12000);
      function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
      window[cb] = function (data) { cleanup(); resolve(data); };
      script.onerror = function () { cleanup(); reject(new Error('jsonp failed')); };
      script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
      document.body.appendChild(script);
    });
  }

  // ---- 既読の記録(この端末のブラウザに保存。開いたお知らせを既読にする) ----
  var READ_KEY = 'news_read_v1', lastCur = [], lastPast = [];
  function keyOf(a) { return String(a.title) + '|' + String(a.startAt); }
  function readMap() {
    try { return JSON.parse(localStorage.getItem(READ_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function isRead(a) { return !!readMap()[keyOf(a)]; }
  function markRead(a) {
    try { var m = readMap(); m[keyOf(a)] = Date.now(); localStorage.setItem(READ_KEY, JSON.stringify(m)); } catch (e) {}
  }
  function pruneRead(cur, past) {   // 今ないお知らせの記録は消して、保存が増え続けないようにする
    try {
      var keep = {}, m = readMap(), out = {};
      cur.concat(past).forEach(function (a) { keep[keyOf(a)] = true; });
      Object.keys(m).forEach(function (k) { if (keep[k]) out[k] = m[k]; });
      localStorage.setItem(READ_KEY, JSON.stringify(out));
    } catch (e) {}
  }

  function renderCurrent() {
    var unread = lastCur.filter(function (a) { return !isRead(a); });
    var read = lastCur.filter(function (a) { return isRead(a); });
    document.getElementById('curCount').textContent = lastCur.length
      ? lastCur.length + '件' + (unread.length ? '(未読 ' + unread.length + ')' : '') : '';
    var html = unread.map(function (a) { return card(a, false); }).join('');
    if (unread.length && read.length) html += '<div class="sub-label">既読</div>';
    html += read.map(function (a) { return card(a, false); }).join('');
    document.getElementById('curList').innerHTML = lastCur.length
      ? html : '<div class="empty">現在公開中のお知らせはありません。</div>';
  }

  function card(a, past) {
    var c = colorOf(a.category);
    var read = !past && isRead(a);
    byId[a.id] = { a: a, past: past };
    return '<div class="card' + (past ? ' past' : '') + (read ? ' read' : '') + '" style="border-left-color:' + c + '" onclick="openDetail(' + a.id + ')">' +
      '<div class="meta">' + ((!past && !read) ? '<span class="dot"></span>' : '') + '<span class="chip" style="color:' + c + ';background:' + c + '1f">' + esc(a.category || 'お知らせ') + '</span>' +
      '<span class="date">' + fmt(a.startAt) + '</span>' +
      ((a.isNew && !read && !past) ? '<span class="badge-new">NEW</span>' : '') + '</div>' +
      '<p class="t">' + esc(a.title) + '</p>' +
      (a.content ? '<p class="pv">' + esc(a.content) + '</p>' : '') + '</div>';
  }

  function render(data) {
    byId = {};
    var cur = data.current || [], past = data.past || [];
    lastCur = cur; lastPast = past;
    pruneRead(cur, past);
    renderCurrent();

    pastCount = past.length;
    document.getElementById('pastList').innerHTML = past.map(function (a) { return card(a, true); }).join('');
    document.getElementById('pastSection').style.display = past.length ? 'block' : 'none';
    pastOpen = false;
    document.getElementById('pastList').style.display = 'none';
    updatePastBtn();
  }

  function updatePastBtn() {
    document.getElementById('pastBtn').textContent =
      (pastOpen ? '過去のお知らせを閉じる' : '過去のお知らせを見る(' + pastCount + '件)');
  }
  function togglePast() {
    pastOpen = !pastOpen;
    document.getElementById('pastList').style.display = pastOpen ? 'block' : 'none';
    updatePastBtn();
  }

  function openDetail(id) {
    var o = byId[id]; if (!o) return;
    var a = o.a, c = colorOf(a.category);
    if (!o.past) markRead(a);
    savedScroll = window.pageYOffset || 0;
    var chip = document.getElementById('dChip');
    chip.textContent = a.category || 'お知らせ';
    chip.style.color = c; chip.style.background = c + '1f';
    document.getElementById('dTitle').textContent = a.title;
    document.getElementById('dDate').textContent = o.past
      ? '掲載期間: ' + fmt(a.startAt) + ' 〜 ' + fmt(a.endAt)
      : (a.startAt ? '掲載日: ' + fmt(a.startAt) : '');
    document.getElementById('dBody').textContent = a.content || '';
    document.getElementById('dBody').style.display = a.content ? 'block' : 'none';

    var img = document.getElementById('dImage');
    img.innerHTML = a.imageUrl ? '<img src="' + esc(a.imageUrl) + '" alt="' + esc(a.title) + '">' : '';
    img.style.display = a.imageUrl ? 'block' : 'none';

    document.getElementById('dActions').innerHTML = a.pdfUrl
      ? '<a href="' + esc(a.pdfUrl) + '" target="_blank" rel="noopener">📄 PDFを見る</a>' : '';

    document.getElementById('title').textContent = 'お知らせ';
    show('detail');
    window.scrollTo(0, 0);
  }

  function goBack() {
    renderCurrent();
    show('list');
    window.scrollTo(0, savedScroll);
  }

  function load() {
    show('loading');
    jsonp(API_URL + '?action=news').then(function (res) {
      var msg = '読み込めませんでした。<br>電波の良い場所で、もう一度お試しください。';
      if (!res || !res.ok || !res.data) { document.getElementById('errText').innerHTML = msg; show('error'); return; }
      if (!Array.isArray(res.data.current)) {
        // サーバー(GAS)側が、まだ news の新しい版になっていないとき
        document.getElementById('errText').innerHTML = 'お知らせの読み込み設定が、まだ新しくなっていません。<br>管理者に連絡してください。';
        show('error'); return;
      }
      render(res.data);
      show('list');
    }).catch(function () { document.getElementById('errText').innerHTML = '読み込めませんでした。<br>電波の良い場所で、もう一度お試しください。'; show('error'); });
  }

  load();
</script>
</body>
</html>
