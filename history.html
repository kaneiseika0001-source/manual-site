<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>申請履歴</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{color-scheme:light;--green:#32675c;--green2:#579b80;--ink:#315f56;--muted:#777d91;--line:#e8edf0;--pale:#edf5f1;--orange:#bb5a08;--orange-bg:#ffead3;--ok:#26835d;--ok-bg:#e0f2e4}
    *{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,760px);margin:auto;padding:24px 24px 42px}.heading{position:relative;text-align:center;margin:8px 0 24px}.back{position:absolute;left:0;top:10px;width:40px;height:44px;display:grid;place-items:center;color:var(--green);text-decoration:none}.back svg{width:32px;height:32px}.title{display:flex;justify-content:center;align-items:center;gap:12px;margin:0;color:#28584f;font-size:clamp(1.8rem,6vw,2.8rem);letter-spacing:.08em}.title svg{width:62px;height:62px;color:var(--green2)}.subtitle{margin:9px 0 0;color:var(--muted);font-size:clamp(1rem,3.8vw,1.45rem)}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 26px}.filter-box{min-width:0;padding:14px 16px 15px;background:linear-gradient(120deg,#f0f7f3,#f7faf8);border-radius:30px}.filter-box label{display:flex;align-items:center;gap:10px;margin:0 0 9px 4px;color:#347265;font-size:1.05rem;font-weight:600}.filter-box label svg{width:24px;height:24px;flex:none}.select-wrap{position:relative}.select-wrap:after{content:"";position:absolute;right:19px;top:50%;width:10px;height:10px;border-right:3px solid var(--green);border-bottom:3px solid var(--green);transform:translateY(-70%) rotate(45deg);pointer-events:none}.filter-control{display:block;width:100%;height:54px;appearance:none;border:1.5px solid #e1e5e8;border-radius:999px;background:#fff;padding:0 43px 0 18px;color:#3d6962;font:inherit;font-size:1.15rem;outline:none}.filter-control:focus{border-color:#74a995;box-shadow:0 0 0 3px #74a99530}.filter-control.date-control{color:var(--muted);padding-right:15px}.date-control::-webkit-calendar-picker-indicator{opacity:.6;cursor:pointer}
    #message{margin:20px 8px;color:var(--muted);text-align:center}.error{color:#b42318!important}.list{display:grid;gap:14px}.item{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto 18px;align-items:center;column-gap:12px;min-height:132px;padding:18px 18px 18px 24px;border:1.5px solid var(--line);border-radius:34px;background:#fff}.item-main{min-width:0}.submitted{margin:0 0 5px;color:var(--muted);font-size:1.03rem;line-height:1.45}.kind{margin:0;color:#315f56;font-size:1.3rem;font-weight:750;line-height:1.4}.summary{margin:4px 0 0;color:var(--muted);font-size:1.03rem;line-height:1.45;overflow-wrap:anywhere}.status{align-self:start;margin-top:2px;white-space:nowrap;border-radius:999px;padding:9px 15px;background:#ececf0;color:#74788c;font-size:.93rem;font-weight:650}.status[data-tone="pending"]{background:var(--orange-bg);color:var(--orange)}.status[data-tone="approved"]{background:var(--ok-bg);color:var(--ok)}.status[data-tone="rejected"]{background:#fde8e7;color:#a52e2e}.chevron{width:16px;height:16px;border-right:3px solid var(--green);border-top:3px solid var(--green);transform:rotate(45deg);justify-self:center}.notice{display:flex;align-items:center;justify-content:center;gap:12px;margin:28px 4px 0;padding:15px 18px;border-radius:999px;background:#eff7f3;color:#35695e;text-align:center;font-size:1rem}.notice svg{width:28px;height:28px;flex:none;color:var(--green2)}
    @media(max-width:560px){main{padding:18px 16px 34px}.heading{margin:8px 0 19px}.title{gap:8px;font-size:1.9rem}.title svg{width:48px;height:48px}.subtitle{font-size:1rem}.filters{gap:8px;margin-bottom:20px}.filter-box{padding:11px 10px 12px;border-radius:27px}.filter-box label{gap:6px;margin-left:2px;font-size:.94rem;white-space:nowrap}.filter-box label svg{width:20px;height:20px}.filter-control{height:48px;padding-left:13px;font-size:1rem}.select-wrap:after{right:15px;width:8px;height:8px}.filter-control.date-control{font-size:.9rem;padding-left:11px}.item{grid-template-columns:minmax(0,1fr) auto 12px;column-gap:8px;min-height:120px;padding:15px 14px 15px 18px;border-radius:29px}.submitted,.summary{font-size:.92rem}.kind{font-size:1.2rem}.status{padding:8px 11px;font-size:.82rem}.chevron{width:12px;height:12px;border-width:2.5px}.notice{font-size:.92rem;padding:13px 14px}}
    @media(max-width:380px){main{padding-left:12px;padding-right:12px}.title{font-size:1.7rem}.filter-box label{font-size:.85rem}.item{padding-left:14px}.status{padding:7px 9px;font-size:.76rem}}
  </style>
</head>
<body>
<main>
  <header class="heading">
    <a class="back" href="./" aria-label="マニュアルへ戻る"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 4-8 8 8 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1 class="title"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M13 5h25l14 14v13" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M38 6v14h14M20 23h14M20 32h12M20 41h9" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="44" cy="44" r="14" fill="white" stroke="currentColor" stroke-width="4"/><path d="M44 36v9l6 3" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>申請履歴</h1>
    <p class="subtitle">ご自身が申請した内容の履歴を確認できます</p>
  </header>
  <section class="filters" aria-label="履歴の絞り込み">
    <div class="filter-box">
      <label for="kindFilter"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2.5"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2.5"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2.5"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2.5"/></svg>申請の種類</label>
      <div class="select-wrap"><select id="kindFilter" class="filter-control"><option value="すべて">すべて</option><option value="労働時間申請">労働時間申請</option><option value="勤怠連絡">勤怠連絡</option><option value="ご意見・改善">ご意見・改善</option></select></div>
    </div>
    <div class="filter-box">
      <label for="dateFilter"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="2.5"/><path d="M7 3v4M17 3v4M3 10h18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="m12 12 1.2 2.2 2.5.4-1.8 1.7.4 2.5-2.3-1.2-2.2 1.2.4-2.5-1.8-1.7 2.5-.4L12 12Z" fill="currentColor"/></svg>日付で検索</label>
      <input id="dateFilter" class="filter-control date-control" type="date" aria-label="表示する日付を選択">
    </div>
  </section>
  <div id="message" role="status" aria-live="polite">LINEに接続しています…</div>
  <section id="list" class="list" aria-label="申請履歴"></section>
  <aside class="notice"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="currentColor"/><path d="M16 14v9M16 9.5h.01" stroke="white" stroke-width="3" stroke-linecap="round"/></svg><span>過去90日分の申請履歴を表示しています</span></aside>
</main>
<script>
  // Google Apps Scriptをウェブアプリとしてデプロイした後、/exec URLを設定してください。
  const CONFIG = {
    LIFF_ID: '2011627592-q2CYZ82u',
    API_URL: 'https://script.google.com/macros/s/AKfycbzWeTxLPpf93T90hndtyNa64LnxBixU4aDj18Zw9VeUAWY6q0oksia3Fwkud_rgFfqYog/exec'
  };
  const message = document.getElementById('message');
  const list = document.getElementById('list');
  const kindFilter = document.getElementById('kindFilter');
  const dateFilter = document.getElementById('dateFilter');
  let allItems = [];

  function setMessage(value, isError=false) { message.textContent=value; message.classList.toggle('error',isError); message.hidden=false; }
  function text(value) {
    if (value == null || value === '') return '';
    if (Array.isArray(value)) return value.map(text).filter(Boolean).join(' / ');
    if (typeof value === 'object') return String(value.text || value.label || value.value || '');
    return String(value);
  }
  function field(item,names) { for (const name of names) if (item[name] != null && item[name] !== '') return item[name]; return ''; }
  function timestamp(item) { return field(item,['timestamp','ts','submittedAt','createdAt','日時','申請日時']); }
  function dateKey(value) {
    if (value instanceof Date && !isNaN(value)) return [value.getFullYear(),String(value.getMonth()+1).padStart(2,'0'),String(value.getDate()).padStart(2,'0')].join('-');
    const s=text(value); const m=s.match(/(20\d{2})[\/-年](\d{1,2})[\/-月](\d{1,2})/);
    return m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : '';
  }
  function displayTimestamp(item) {
    const value=timestamp(item); if (!value) return text(field(item,['date','対象日','applicationDate','workDate'])) || '日時未設定';
    const d=value instanceof Date ? value : new Date(value);
    if (isNaN(d)) return text(value);
    return new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  }
  function statusTone(value) {
    if (/申請中|受付|確認中|保留/.test(value)) return 'pending';
    if (/申請済|承認|確認済|完了/.test(value)) return 'approved';
    if (/却下|否認|差戻/.test(value)) return 'rejected';
    return 'neutral';
  }
  function render() {
    list.replaceChildren();
    const selectedKind=kindFilter.value, selectedDate=dateFilter.value;
    const shown=allItems.filter(item=>{
      const kind=text(field(item,['kind','種類','applicationKind','typeOfApplication']));
      const date=timestamp(item) || field(item,['date','対象日','applicationDate','workDate']);
      return (selectedKind==='すべて'||kind===selectedKind) && (!selectedDate||dateKey(date)===selectedDate);
    });
    if (!shown.length) { setMessage(allItems.length?'条件に合う履歴はありません。':'申請履歴はありません。'); return; }
    message.hidden=true;
    for (const item of shown) {
      const article=document.createElement('article'); article.className='item';
      const main=document.createElement('div'); main.className='item-main';
      const submitted=document.createElement('p'); submitted.className='submitted'; submitted.textContent=displayTimestamp(item);
      const kind=document.createElement('h2'); kind.className='kind'; kind.textContent=text(field(item,['kind','種類','applicationKind','typeOfApplication']))||'申請';
      const rawDetails=field(item,['details','detail','詳細','items']);
      const details=Array.isArray(rawDetails)?rawDetails.map(text).filter(Boolean):rawDetails?[text(rawDetails)]:[];
      const reason=text(field(item,['reason','理由','memo','備考','メモ'])); if (reason && !details.includes(reason)) details.unshift(reason);
      const category=text(field(item,['type','申請種別','内容','category']));
      const summaryText=category ? `内容：${category}` : details.length ? `内容：${details.join('・')}` : '';
      if (summaryText) { const summary=document.createElement('p'); summary.className='summary'; summary.textContent=summaryText; main.append(submitted,kind,summary); }
      else main.append(submitted,kind);
      const statusText=text(field(item,['status','ステータス','状態']))||'受付';
      const status=document.createElement('span'); status.className='status'; status.textContent=statusText; status.dataset.tone=statusTone(statusText);
      const chevron=document.createElement('span'); chevron.className='chevron'; chevron.setAttribute('aria-hidden','true');
      article.append(main,status,chevron); list.append(article);
    }
  }
  kindFilter.addEventListener('change',render); dateFilter.addEventListener('change',render);

  async function start() {
    if (CONFIG.LIFF_ID.includes('ここに') || CONFIG.API_URL.includes('ここに')) { setMessage('LIFF_IDとAPI_URLを設定すると履歴が表示されます。',true); return; }
    try {
      await liff.init({liffId:CONFIG.LIFF_ID});
      if (!liff.isLoggedIn()) { liff.login({redirectUri:location.href}); return; }
      setMessage('申請履歴を読み込んでいます…');
      const idToken=liff.getIDToken();
      if (!idToken) throw new Error('LINEのIDトークンを取得できませんでした。LIFFの設定を確認してください。');
      const response=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({idToken})});
      if (!response.ok) throw new Error('履歴APIに接続できませんでした（HTTP '+response.status+'）。');
      const result=await response.json();
      if (result && result.ok===false) throw new Error(result.message||result.error||'履歴を取得できませんでした。');
      allItems=Array.isArray(result)?result:(result.items||result.history||result.data||[]);
      if (!Array.isArray(allItems)) throw new Error('APIの応答形式を確認してください。');
      render();
    } catch(error) { setMessage(error.message||'申請履歴を読み込めませんでした。設定とGASのデプロイを確認してください。',true); }
  }
  start();
</script>
</body>
</html>
