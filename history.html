<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>申請履歴</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --sub:#69707a; --line:#e6e8ec;
          --ok-bg:#d9f2e3; --ok:#12713a; --wait-bg:#fff0cc; --wait:#8a5a00; --off-bg:#e9ebef; --off:#3b424c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --card:#1b1f24; --text:#eceef1; --sub:#98a0ab; --line:#2a2f36;
            --ok-bg:#16402a; --ok:#7fe0a6; --wait-bg:#47350a; --wait:#f5cd6b; --off-bg:#2a2f36; --off:#c4cad2; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif; line-height:1.6; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 2px; }
  .note { color:var(--sub); font-size:13px; margin:0 0 16px; }
  .list { background:var(--card); border:1px solid var(--line); border-radius:12px; }
  .item { padding:14px 16px; border-top:1px solid var(--line); }
  .item:first-child { border-top:0; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .title { font-weight:700; }
  .meta { color:var(--sub); font-size:14px; }
  .detail { color:var(--sub); font-size:13px; white-space:pre-line; margin-top:4px; }
  .badge { flex:none; font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px;
           background:var(--off-bg); color:var(--off); }
  .badge.ok { background:var(--ok-bg); color:var(--ok); }
  .badge.wait { background:var(--wait-bg); color:var(--wait); }
  .msg { padding:24px 16px; text-align:center; color:var(--sub); }
</style>
</head>
<body>
<main>
  <h1>申請履歴</h1>
  <p class="note" id="who">自分の申請のみ表示</p>
  <div class="list" id="list"><div class="msg">読み込み中…</div></div>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LIFF_ID = '2011627592-q2CYZ82u';
  const API_URL = 'https://script.google.com/macros/s/AKfycbzWeTxLPpf93T90hndtyNa64LnxBixU4aDj18Zw9VeUAWY6q0oksia3Fwkud_rgFfqYog/exec';

  const list = document.getElementById('list');
  const show = (text) => { list.innerHTML = ''; const d = document.createElement('div'); d.className = 'msg'; d.textContent = text; list.appendChild(d); };

  function badgeClass(s) {
    if (/済|完了/.test(s) && !/未/.test(s)) return 'ok';
    if (/確認中|申請済|未確認/.test(s)) return 'wait';
    return '';
  }

  function render(items) {
    if (!items.length) { show('申請はまだありません'); return; }
    list.innerHTML = '';
    items.forEach(it => {
      const el = document.createElement('div'); el.className = 'item';
      const row = document.createElement('div'); row.className = 'row';
      const left = document.createElement('div');
      const title = document.createElement('div'); title.className = 'title'; title.textContent = it.sentAt + '\u3000' + it.type;
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = it.kind + ' ・ 対象日:' + it.targetDate;
      left.append(title, meta);
      const badge = document.createElement('span'); badge.className = 'badge ' + badgeClass(it.status); badge.textContent = it.status;
      row.append(left, badge); el.appendChild(row);
      if (it.detail) { const d = document.createElement('div'); d.className = 'detail'; d.textContent = it.detail; el.appendChild(d); }
      list.appendChild(el);
    });
  }

  (async () => {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライトを避ける
        body: JSON.stringify({ idToken: liff.getIDToken() })
      });
      const data = await res.json();
      if (!data.ok) {
        show(data.error === 'not_registered'
          ? 'スタッフ名簿にあなたのLINEが登録されていません。管理者に連絡してください。'
          : '読み込めませんでした。LINEを開き直してください。(' + data.error + ')');
        return;
      }
      document.getElementById('who').textContent = data.name + 'さんの申請のみ表示';
      render(data.items);
    } catch (e) {
      show('読み込めませんでした。通信状況を確認して、開き直してください。');
    }
  })();
</script>
</body>
</html>
