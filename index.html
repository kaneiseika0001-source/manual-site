<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ルール・マニュアル</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2a44;
    --sub: #6b7280;
    --accent: #3b6fd6;
    --border: #e7ebf3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 40px; }

  /* --- ヘッダー --- */
  header.top {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 4px; background: var(--bg);
    position: sticky; top: 0; z-index: 5;
  }
  header.top .back {
    font-size: 24px; color: var(--text); cursor: pointer; width: 24px; text-align: center;
    visibility: hidden;
  }
  header.top .back.show { visibility: visible; }
  header.top h1 { font-size: 16px; font-weight: 700; margin: 0; flex: 1; }

  /* --- ヒーローエリア --- */
  .hero {
    margin: 4px 16px 16px;
    border-radius: 18px;
    background: #ffffff;
    overflow: hidden;
    text-align: center;
    padding-bottom: 12px;
  }
  .hero .hero-banner { width: 100%; display: block; }
  .hero .desc { font-size: 11.5px; color: #5b6579; margin: 10px 16px 0; line-height: 1.5; }

  /* --- 検索 --- */
  .search {
    margin: 0 16px 16px; padding: 14px 16px; border-radius: 16px; background: var(--card);
    display: flex; align-items: center; gap: 10px; color: var(--sub); font-size: 14px;
    box-shadow: 0 1px 3px rgba(20,30,60,0.06);
  }
  .search svg { flex-shrink: 0; }
  .search input { border: none; outline: none; flex: 1; font-size: 14px; background: transparent; color: var(--text); }

  /* --- セクション見出し --- */
  .section { margin: 0 16px 18px; }
  .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .section-head h3 { font-size: 15px; font-weight: 800; margin: 0; }

  /* --- よく見るカード(横長) --- */
  .feature-card {
    display: flex; align-items: center; gap: 14px;
    background: #eef4ff; border-radius: 16px; padding: 16px;
    cursor: pointer;
  }
  .feature-card .ic { font-size: 26px; flex-shrink: 0; }
  .feature-card .body { flex: 1; min-width: 0; }
  .feature-card .t { font-size: 15px; font-weight: 800; margin: 0 0 2px; }
  .feature-card .d { font-size: 12px; color: var(--sub); margin: 0; }
  .feature-card .chev { color: #9aa8c7; font-size: 18px; }

  /* --- カテゴリ縦積みカード --- */
  .cat-list { display: flex; flex-direction: column; gap: 10px; }
  .cat-card {
    display: flex; align-items: center; gap: 14px;
    border-radius: 16px; padding: 15px 16px;
    cursor: pointer;
  }
  .cat-card .ic-wrap {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.6);
  }
  .cat-card .body { flex: 1; min-width: 0; }
  .cat-card .t { font-size: 15px; font-weight: 800; margin: 0 0 2px; }
  .cat-card .d { font-size: 12px; color: #5b6579; margin: 0; }
  .cat-card .chev { color: rgba(31,42,68,0.35); font-size: 18px; }

  /* --- マニュアルの1件カード(検索結果・カテゴリ詳細・最近見た等) --- */
  .list-card {
    background: var(--card); border-radius: 14px; border: 1px solid var(--border);
    padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; cursor: pointer;
  }
  .list-card .ic {
    width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .list-card .ic svg { width: 18px; height: 18px; }
  .list-card .body { flex: 1; min-width: 0; }
  .list-card .t { font-size: 14px; font-weight: 700; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-card .c { font-size: 11.5px; color: var(--sub); margin: 0; }
  .list-card .chev { color: #c3c9d6; font-size: 16px; }

  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 40px 20px; }

  /* --- 詳細画面 --- */
  .detail-head { margin: 4px 16px 18px; }
  .detail-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; color: #fff; font-size: 12.5px; font-weight: 700; }
  .detail-title { font-size: 19px; font-weight: 800; margin: 12px 0 4px; }
  .detail-date { font-size: 12px; color: var(--sub); }
  .detail-body {
    margin: 0 16px; background: var(--card); border-radius: 14px; border: 1px solid var(--border);
    padding: 16px; font-size: 14px; line-height: 1.9; white-space: pre-wrap;
  }
  .related-btn {
    margin: 16px; padding: 13px; border-radius: 12px; background: var(--card); border: 1px solid var(--border);
    text-align: center; font-size: 13.5px; font-weight: 700; color: var(--accent); cursor: pointer;
  }

  .view { display: none; }
  .view.active { display: block; }
</style>
</head>

  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const script = document.createElement('script');
      window[cbName] = (data) => {
        resolve(data);
        delete window[cbName];
        script.remove();
      };
      script.onerror = () => reject(new Error('JSONP failed'));
      script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
      document.body.appendChild(script);
    });
  }

  function fetchManuals() {

  function getMeta(category) {
    return CATEGORY_META[category] || FALLBACK_META;
  }

  function getViewCounts() {
    try { return JSON.parse(localStorage.getItem(VIEW_COUNT_KEY) || '{}'); } catch (e) { return {}; }
  }
  function incrementViewCount(id) {
    const counts = getViewCounts();
    counts[id] = (counts[id] || 0) + 1;
    localStorage.setItem(VIEW_COUNT_KEY, JSON.stringify(counts));
  }
  function getFrequentlyViewedIds() {
    const counts = getViewCounts();
    return Object.keys(counts)
      .filter(id => counts[id] > 0)
      .sort((a, b) => counts[b] - counts[a])
      .slice(0, MAX_FREQUENT)
      .map(id => Number(id));
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function cardHtml(m) {
    const meta = getMeta(m.category);
    return '<div class="list-card" onclick="openDetail(' + m.id + ')">' +
      '<div class="ic" style="background:' + meta.bg + ';color:' + meta.fg + '">' + meta.icon + '</div>' +
      '<div class="body">' +
        '<p class="t">' + escapeHtml(m.title) + '</p>' +
        '<p class="c">' + escapeHtml(m.category) + (m.updatedAt ? ' ・ ' + m.updatedAt : '') + '</p>' +
      '</div>' +
      '<span class="chev">›</span>' +
    '</div>';
  }

  function renderCategoryList() {
    const seen = [];
    manuals.forEach(m => { if (!seen.includes(m.category)) seen.push(m.category); });

    document.getElementById('categoryList').innerHTML = seen.map(cat => {
      const meta = getMeta(cat);
      const desc = CATEGORY_DESC[cat] || '関連するマニュアル';
      return '<div class="cat-card" style="background:' + meta.bg + '" onclick="showCategory(\'' + cat.replace(/'/g, "\\'") + '\')">' +
        '<div class="ic-wrap" style="color:' + meta.fg + '">' + meta.icon + '</div>' +
        '<div class="body">' +
          '<p class="t">' + escapeHtml(cat) + '</p>' +
          '<p class="d">' + escapeHtml(desc) + '</p>' +
        '</div>' +
        '<span class="chev">›</span>' +
      '</div>';
    }).join('');
  }

  function showCategory(cat) {
    const filtered = manuals.filter(m => m.category === cat);
    document.getElementById('normalSections').style.display = 'none';
    document.getElementById('categoryResultSection').style.display = 'block';
    document.getElementById('categoryResultTitle').textContent = cat;
    document.getElementById('categoryResultList').innerHTML = filtered.length
      ? filtered.map(cardHtml).join('')
      : '<div class="empty">該当するマニュアルがありません。</div>';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';

    inCategoryView = true;
    document.getElementById('backBtn').classList.add('show');
    document.getElementById('headerTitle').textContent = cat;
  }

  /* カテゴリ詳細表示から、トップ(カテゴリ一覧)に戻る */
  function backToCategoryHome() {
    document.getElementById('normalSections').style.display = 'block';
    document.getElementById('categoryResultSection').style.display = 'none';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';

    inCategoryView = false;
    document.getElementById('backBtn').classList.remove('show');
    document.getElementById('headerTitle').textContent = '';
  }

  function onSearch() {
    const q = document.getElementById('searchInput').value.trim();
    const resultsEl = document.getElementById('searchResults');
    const normalEl = document.getElementById('normalSections');
    const catEl = document.getElementById('categoryResultSection');

    if (!q) {
      resultsEl.innerHTML = '';
      normalEl.style.display = 'block';
      catEl.style.display = 'none';
      return;
    }
    normalEl.style.display = 'none';
    catEl.style.display = 'none';

    const matched = manuals.filter(m => m.title.includes(q) || m.category.includes(q) || m.body.includes(q));
    resultsEl.innerHTML = '<div class="section"><div class="section-head"><h3>検索結果(' + matched.length + '件)</h3></div>' +
      (matched.length ? matched.map(cardHtml).join('') : '<div class="empty">該当するマニュアルが見つかりませんでした。</div>') +
      '</div>';
  }

  function renderFrequent() {
    const ids = getFrequentlyViewedIds();
    const items = ids.map(id => manuals.find(m => m.id === id)).filter(Boolean);
    document.getElementById('frequentList').innerHTML = items.map(cardHtml).join('');
    document.getElementById('frequentEmpty').style.display = items.length ? 'none' : 'block';
  }

  function openDetail(id) {
    const m = manuals.find(x => x.id === id);
    if (!m) return;
    incrementViewCount(id);
    const meta = getMeta(m.category);
    document.getElementById('detailBadge').textContent = m.category;
    document.getElementById('detailBadge').style.background = meta.fg;
    document.getElementById('detailTitle').textContent = m.title;
    document.getElementById('detailDate').textContent = m.updatedAt ? '更新日: ' + m.updatedAt : '';
    document.getElementById('detailBody').textContent = m.body;
    showView('detail');
  }

  function showView(name) {
    if (viewStack[viewStack.length - 1] !== name) viewStack.push(name);
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');

    const titles = { list: '', detail: 'ルール・マニュアル', frequent: 'よく見る' };

    if (name === 'frequent') renderFrequent();
    if (name === 'list') {
      if (inCategoryView) {
        // カテゴリを見ている途中で詳細画面を開いて戻ってきた場合は、そのカテゴリ表示を維持する
        document.getElementById('backBtn').classList.add('show');
      } else {
        document.getElementById('backBtn').classList.toggle('show', false);
        document.getElementById('headerTitle').textContent = titles[name];
        document.getElementById('normalSections').style.display = 'block';
        document.getElementById('categoryResultSection').style.display = 'none';
        renderCategoryList();
      }
    } else {
      document.getElementById('backBtn').classList.toggle('show', name !== 'list');
      document.getElementById('headerTitle').textContent = titles[name];
    }
  }

  function goBack() {
    const currentView = viewStack[viewStack.length - 1];
    if (currentView === 'list' && inCategoryView) {
      backToCategoryHome();
      return;
    }
    if (viewStack.length > 1) {
      viewStack.pop();
      const prev = viewStack[viewStack.length - 1];
      viewStack.pop();
      showView(prev);
    } else {
      showView('list');
    }
  }

  fetchManuals().then(renderCategoryList);
</script>
</body>
</html>
