<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ルール・マニュアル</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2a44;
    --sub: #6b7280;
    --accent: #3b6fd6;
    --border: #e7ebf3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 40px; }

  /* --- ヘッダー --- */
  header.top {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 4px; background: var(--bg);
    position: sticky; top: 0; z-index: 5;
  }
  header.top .back {
    font-size: 24px; color: var(--text); cursor: pointer; width: 24px; text-align: center;
    visibility: hidden;
  }
  header.top .back.show { visibility: visible; }
  header.top h1 { font-size: 16px; font-weight: 700; margin: 0; flex: 1; }

  /* --- ヒーローエリア --- */
  .hero {
    position: relative;
    margin: 4px 16px 16px;
    padding: 28px 20px 24px;
    border-radius: 22px;
    background: linear-gradient(135deg, #eaf1ff 0%, #f7fafe 55%, #eef7f0 100%);
    overflow: hidden;
    text-align: center;
  }
  .hero .leaf {
    position: absolute; top: -10px; right: -10px; width: 120px; opacity: 0.9;
  }
  .hero .tagline {
    position: absolute; top: 14px; right: 18px; font-size: 11px; color: #8a95ab;
    font-style: italic; max-width: 90px; text-align: right; line-height: 1.3;
  }
  .hero .book-icon { width: 56px; height: 56px; margin: 0 auto 10px; }
  .hero h2 { font-size: 22px; font-weight: 800; margin: 0 0 2px; letter-spacing: 0.5px; }
  .hero .sub { font-size: 14px; font-weight: 700; color: var(--accent); margin: 0 0 8px; }
  .hero .desc { font-size: 12.5px; color: #5b6579; margin: 0; line-height: 1.6; }

  /* --- 検索 --- */
  .search {
    margin: 0 16px 16px; padding: 14px 16px; border-radius: 16px; background: var(--card);
    display: flex; align-items: center; gap: 10px; color: var(--sub); font-size: 14px;
    box-shadow: 0 1px 3px rgba(20,30,60,0.06);
  }
  .search svg { flex-shrink: 0; }
  .search input { border: none; outline: none; flex: 1; font-size: 14px; background: transparent; color: var(--text); }

  /* --- セクション見出し --- */
  .section { margin: 0 16px 18px; }
  .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .section-head h3 { font-size: 15px; font-weight: 800; margin: 0; }

  /* --- よく見るカード(横長) --- */
  .feature-card {
    display: flex; align-items: center; gap: 14px;
    background: #eef4ff; border-radius: 16px; padding: 16px;
    cursor: pointer;
  }
  .feature-card .ic { font-size: 26px; flex-shrink: 0; }
  .feature-card .body { flex: 1; min-width: 0; }
  .feature-card .t { font-size: 15px; font-weight: 800; margin: 0 0 2px; }
  .feature-card .d { font-size: 12px; color: var(--sub); margin: 0; }
  .feature-card .chev { color: #9aa8c7; font-size: 18px; }

  /* --- カテゴリ縦積みカード --- */
  .cat-list { display: flex; flex-direction: column; gap: 10px; }
  .cat-card {
    display: flex; align-items: center; gap: 14px;
    border-radius: 16px; padding: 15px 16px;
    cursor: pointer;
  }
  .cat-card .ic-wrap {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.6);
  }
  .cat-card .body { flex: 1; min-width: 0; }
  .cat-card .t { font-size: 15px; font-weight: 800; margin: 0 0 2px; }
  .cat-card .d { font-size: 12px; color: #5b6579; margin: 0; }
  .cat-card .chev { color: rgba(31,42,68,0.35); font-size: 18px; }

  /* --- マニュアルの1件カード(検索結果・カテゴリ詳細・最近見た等) --- */
  .list-card {
    background: var(--card); border-radius: 14px; border: 1px solid var(--border);
    padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; cursor: pointer;
  }
  .list-card .ic {
    width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .list-card .ic svg { width: 18px; height: 18px; }
  .list-card .body { flex: 1; min-width: 0; }
  .list-card .t { font-size: 14px; font-weight: 700; margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-card .c { font-size: 11.5px; color: var(--sub); margin: 0; }
  .list-card .chev { color: #c3c9d6; font-size: 16px; }

  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 40px 20px; }

  /* --- 詳細画面 --- */
  .detail-head { margin: 4px 16px 18px; }
  .detail-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; color: #fff; font-size: 12.5px; font-weight: 700; }
  .detail-title { font-size: 19px; font-weight: 800; margin: 12px 0 4px; }
  .detail-date { font-size: 12px; color: var(--sub); }
  .detail-body {
    margin: 0 16px; background: var(--card); border-radius: 14px; border: 1px solid var(--border);
    padding: 16px; font-size: 14px; line-height: 1.9; white-space: pre-wrap;
  }
  .related-btn {
    margin: 16px; padding: 13px; border-radius: 12px; background: var(--card); border: 1px solid var(--border);
    text-align: center; font-size: 13.5px; font-weight: 700; color: var(--accent); cursor: pointer;
  }

  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="back" id="backBtn" onclick="goBack()">‹</span>
    <h1 id="headerTitle">ルール・マニュアル</h1>
  </header>

  <!-- ================= 一覧画面 ================= -->
  <div class="view active" id="view-list">
    <div class="hero">
      <svg class="leaf" viewBox="0 0 120 120" fill="none"><path d="M100 10C80 20 60 40 55 70C70 65 90 50 100 10Z" fill="#c9e3cf"/><path d="M95 30C78 38 65 52 62 72C74 66 88 55 95 30Z" fill="#a9d3b3"/></svg>
      <div class="tagline">for a better workplace</div>
      <svg class="book-icon" viewBox="0 0 64 64" fill="none">
        <rect x="8" y="14" width="20" height="36" rx="3" fill="#3b6fd6"/>
        <rect x="36" y="14" width="20" height="36" rx="3" fill="#6f9af0"/>
        <rect x="30" y="14" width="4" height="36" fill="#274d9e"/>
        <rect x="12" y="20" width="12" height="2.5" rx="1.2" fill="#ffffff" opacity="0.85"/>
        <rect x="12" y="26" width="12" height="2.5" rx="1.2" fill="#ffffff" opacity="0.85"/>
        <rect x="12" y="32" width="8" height="2.5" rx="1.2" fill="#ffffff" opacity="0.85"/>
        <rect x="40" y="20" width="12" height="2.5" rx="1.2" fill="#ffffff" opacity="0.85"/>
        <rect x="40" y="26" width="12" height="2.5" rx="1.2" fill="#ffffff" opacity="0.85"/>
        <rect x="40" y="32" width="8" height="2.5" rx="1.2" fill="#ffffff" opacity="0.85"/>
      </svg>
      <h2>ルール・マニュアル</h2>
      <p class="sub">サポートサイト</p>
      <p class="desc">みんなでつくる、安心・安全で働きやすい職場</p>
    </div>

    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#9aa3b5" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="#9aa3b5" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" placeholder="マニュアルを検索" oninput="onSearch()">
    </div>

    <div id="searchResults"></div>

    <div id="normalSections">
      <div class="section">
        <div class="feature-card" onclick="showView('frequent')">
          <span class="ic">⭐</span>
          <div class="body">
            <p class="t">よく見る</p>
            <p class="d">よく使うマニュアルにすぐアクセス</p>
          </div>
          <span class="chev">›</span>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><h3>カテゴリ</h3></div>
        <div class="cat-list" id="categoryList"></div>
      </div>
    </div>

    <div id="categoryResultSection" style="display:none;">
      <div class="section">
        <div class="section-head"><h3 id="categoryResultTitle"></h3></div>
        <div id="categoryResultList"></div>
      </div>
    </div>
  </div>

  <!-- ================= よく見る一覧 ================= -->
  <div class="view" id="view-frequent">
    <div class="section" style="margin-top: 10px;">
      <div id="frequentList"></div>
      <div id="frequentEmpty" class="empty" style="display:none;">マニュアルを開くと、よく見るものがここに表示されます。</div>
    </div>
  </div>

  <!-- ================= 詳細画面 ================= -->
  <div class="view" id="view-detail">
    <div class="detail-head">
      <span class="detail-badge" id="detailBadge"></span>
      <div class="detail-title" id="detailTitle"></div>
      <div class="detail-date" id="detailDate"></div>
    </div>
    <div class="detail-body" id="detailBody"></div>
    <div class="related-btn" onclick="showView('list')">一覧に戻る</div>
  </div>
</div>

<script>
  // ここをGASのWebアプリURL(/execで終わるもの)に置き換えてください
  const API_URL = 'https://script.google.com/macros/s/AKfycbzWeTxLPpf93T90hndtyNa64LnxBixU4aDj18Zw9VeUAWY6q0oksia3Fwkud_rgFfqYog/exec';

  const RECENT_KEY = 'manual_recent_v1';
  const VIEW_COUNT_KEY = 'manual_view_count_v1';
  const MAX_FREQUENT = 6;

  let manuals = [];
  let viewStack = ['list'];

  /* ---- JSONPでGASのAPIを呼ぶ(別ドメインのCORS制約を回避するため) ---- */
  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cbName = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const script = document.createElement('script');
      window[cbName] = (data) => {
        resolve(data);
        delete window[cbName];
        script.remove();
      };
      script.onerror = () => reject(new Error('JSONP failed'));
      script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
      document.body.appendChild(script);
    });
  }

  function fetchManuals() {
    return jsonp(API_URL + '?action=manuals')
      .then(res => { manuals = (res && res.ok) ? res.data : []; })
      .catch(() => { manuals = []; });
  }

  /* ---- カテゴリごとのアイコン(SVG)・色 ---- */
  const CATEGORY_META = {
    '勤怠・勤務': { bg: '#e5f5ea', fg: '#2e9e52', icon: iconPeople() },
    '休暇':       { bg: '#fdf1de', fg: '#e0942b', icon: iconPalm() },
    '社内ルール':  { bg: '#f1e9fb', fg: '#7c4fc4', icon: iconDoc() },
    'PAリーダー':  { bg: '#fbe9e9', fg: '#d64545', icon: iconPeople() },
    '資材・備品':  { bg: '#e6eefc', fg: '#3b6fd6', icon: iconBox() },
    '安全・衛生':  { bg: '#fdeee0', fg: '#e07a1f', icon: iconShield() },
    'その他':      { bg: '#eef0f4', fg: '#7a8397', icon: iconDots() }
  };
  const CATEGORY_DESC = {
    '勤怠・勤務': '出勤・欠勤・遅刻・早退 など',
    '休暇': '休暇の取得・申請について',
    '社内ルール': '社内の決まりごと',
    'PAリーダー': 'リーダー向け情報・連絡事項',
    '資材・備品': '資材・備品のルール',
    '安全・衛生': '安全管理・衛生管理',
    'その他': 'その他のマニュアル'
  };
  const FALLBACK_META = { bg: '#eef0f4', fg: '#7a8397', icon: iconDoc() };

  function iconPeople() {
    return '<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" fill="currentColor"/><circle cx="17" cy="9" r="2.4" fill="currentColor" opacity="0.75"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M14.5 14.2c2.6 0.3 4.5 2.2 4.5 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/></svg>';
  }
  function iconBox() {
    return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2L12 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 7.2L12 11l8-3.8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 11v10" stroke="currentColor" stroke-width="1.8"/></svg>';
  }
  function iconShield() {
    return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6l7-3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function iconDoc() {
    return '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  }
  function iconPalm() {
    return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 21V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 11c-3-4-8-3-9-1 2 2 6 2 9 1z" fill="currentColor" opacity="0.85"/><path d="M12 11c3-4 8-3 9-1-2 2-6 2-9 1z" fill="currentColor" opacity="0.85"/><path d="M12 11c-1-3 0-6 2-7-1 3-1 5-2 7z" fill="currentColor"/></svg>';
  }
  function iconDots() {
    return '<svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 4v-4H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8" cy="11" r="1.1" fill="currentColor"/><circle cx="12" cy="11" r="1.1" fill="currentColor"/><circle cx="16" cy="11" r="1.1" fill="currentColor"/></svg>';
  }

  function getMeta(category) {
    return CATEGORY_META[category] || FALLBACK_META;
  }

  function getViewCounts() {
    try { return JSON.parse(localStorage.getItem(VIEW_COUNT_KEY) || '{}'); } catch (e) { return {}; }
  }
  function incrementViewCount(id) {
    const counts = getViewCounts();
    counts[id] = (counts[id] || 0) + 1;
    localStorage.setItem(VIEW_COUNT_KEY, JSON.stringify(counts));
  }
  function getFrequentlyViewedIds() {
    const counts = getViewCounts();
    return Object.keys(counts)
      .filter(id => counts[id] > 0)
      .sort((a, b) => counts[b] - counts[a])
      .slice(0, MAX_FREQUENT)
      .map(id => Number(id));
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function cardHtml(m) {
    const meta = getMeta(m.category);
    return '<div class="list-card" onclick="openDetail(' + m.id + ')">' +
      '<div class="ic" style="background:' + meta.bg + ';color:' + meta.fg + '">' + meta.icon + '</div>' +
      '<div class="body">' +
        '<p class="t">' + escapeHtml(m.title) + '</p>' +
        '<p class="c">' + escapeHtml(m.category) + (m.updatedAt ? ' ・ ' + m.updatedAt : '') + '</p>' +
      '</div>' +
      '<span class="chev">›</span>' +
    '</div>';
  }

  function renderCategoryList() {
    const seen = [];
    manuals.forEach(m => { if (!seen.includes(m.category)) seen.push(m.category); });

    document.getElementById('categoryList').innerHTML = seen.map(cat => {
      const meta = getMeta(cat);
      const desc = CATEGORY_DESC[cat] || '関連するマニュアル';
      return '<div class="cat-card" style="background:' + meta.bg + '" onclick="showCategory(\\'' + cat.replace(/'/g, "\\\\'") + '\\')">' +
        '<div class="ic-wrap" style="color:' + meta.fg + '">' + meta.icon + '</div>' +
        '<div class="body">' +
          '<p class="t">' + escapeHtml(cat) + '</p>' +
          '<p class="d">' + escapeHtml(desc) + '</p>' +
        '</div>' +
        '<span class="chev">›</span>' +
      '</div>';
    }).join('');
  }

  function showCategory(cat) {
    const filtered = manuals.filter(m => m.category === cat);
    document.getElementById('normalSections').style.display = 'none';
    document.getElementById('categoryResultSection').style.display = 'block';
    document.getElementById('categoryResultTitle').textContent = cat;
    document.getElementById('categoryResultList').innerHTML = filtered.length
      ? filtered.map(cardHtml).join('')
      : '<div class="empty">該当するマニュアルがありません。</div>';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchResults').innerHTML = '';
  }

  function onSearch() {
    const q = document.getElementById('searchInput').value.trim();
    const resultsEl = document.getElementById('searchResults');
    const normalEl = document.getElementById('normalSections');
    const catEl = document.getElementById('categoryResultSection');

    if (!q) {
      resultsEl.innerHTML = '';
      normalEl.style.display = 'block';
      catEl.style.display = 'none';
      return;
    }
    normalEl.style.display = 'none';
    catEl.style.display = 'none';

    const matched = manuals.filter(m => m.title.includes(q) || m.category.includes(q) || m.body.includes(q));
    resultsEl.innerHTML = '<div class="section"><div class="section-head"><h3>検索結果(' + matched.length + '件)</h3></div>' +
      (matched.length ? matched.map(cardHtml).join('') : '<div class="empty">該当するマニュアルが見つかりませんでした。</div>') +
      '</div>';
  }

  function renderFrequent() {
    const ids = getFrequentlyViewedIds();
    const items = ids.map(id => manuals.find(m => m.id === id)).filter(Boolean);
    document.getElementById('frequentList').innerHTML = items.map(cardHtml).join('');
    document.getElementById('frequentEmpty').style.display = items.length ? 'none' : 'block';
  }

  function openDetail(id) {
    const m = manuals.find(x => x.id === id);
    if (!m) return;
    incrementViewCount(id);
    const meta = getMeta(m.category);
    document.getElementById('detailBadge').textContent = m.category;
    document.getElementById('detailBadge').style.background = meta.fg;
    document.getElementById('detailTitle').textContent = m.title;
    document.getElementById('detailDate').textContent = m.updatedAt ? '更新日: ' + m.updatedAt : '';
    document.getElementById('detailBody').textContent = m.body;
    showView('detail');
  }

  function showView(name) {
    if (viewStack[viewStack.length - 1] !== name) viewStack.push(name);
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    document.getElementById('backBtn').classList.toggle('show', name !== 'list');

    const titles = { list: 'ルール・マニュアル', detail: 'ルール・マニュアル', frequent: 'よく見る' };
    document.getElementById('headerTitle').textContent = titles[name];

    if (name === 'frequent') renderFrequent();
    if (name === 'list') {
      document.getElementById('normalSections').style.display = 'block';
      document.getElementById('categoryResultSection').style.display = 'none';
      renderCategoryList();
    }
  }

  function goBack() {
    if (viewStack.length > 1) {
      viewStack.pop();
      const prev = viewStack[viewStack.length - 1];
      viewStack.pop();
      showView(prev);
    } else {
      showView('list');
    }
  }

  fetchManuals().then(renderCategoryList);
</script>
</body>
</html>
