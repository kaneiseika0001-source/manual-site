<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォームを開いています</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#555}
</style>
</head>
<body>
<p>フォームを開いています…</p>
<script>
const LIFF_ID = '2011627592-CPMcSlWW';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzWeTxLPpf93T90hndtyNa64LnxBixU4aDj18Zw9VeUAWY6q0oksia3Fwkud_rgFfqYog/exec';

const FORMS = {
  kintai: {
    base: 'https://docs.google.com/forms/d/e/1FAIpQLSefEEj-YN5fP6YpdniowDxnreOsgDMHRPD1fX3nNCetm7MQIQ/viewform',
    entry: 'entry.938369649'
  },
  labor: {
    base: 'https://docs.google.com/forms/d/e/1FAIpQLScfKA2HP4WtkpuiZ-vEtg2Hq-6K2dZOLPxGjOWIO5FxYCuSlw/viewform',
    entry: 'entry.188643478'
  }
};

// GASはCORSヘッダーを付けられないので、JSONP（scriptタグ）で呼ぶ
function callGas(params) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now();
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 8000);
    function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('load error')); };
    script.src = GAS_URL + '?' + new URLSearchParams(Object.assign({ callback: cb }, params));
    document.body.appendChild(script);
  });
}

const msgEl = document.querySelector('p');
function show(t) { msgEl.textContent = t; }
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' が' + (ms / 1000) + '秒たっても終わりません')), ms))
  ]);
}

(async () => {
  try {
    show('1/4 LINEに接続中…');
    await withTimeout(liff.init({ liffId: LIFF_ID }), 8000, 'LINEへの接続');

    // ?f=kintai を、通常の渡され方と、LIFFが入れ替えた liff.state の両方から探す
    const q = new URLSearchParams(location.search);
    let key = q.get('f');
    if (!key && q.get('liff.state')) {
      key = new URLSearchParams(q.get('liff.state').replace(/^\//, '')).get('f');
    }
    const form = FORMS[key];
    if (!form) { show('フォームが指定されていません(f=' + key + ')'); return; }

    show('2/4 ログイン確認中…');
    if (!liff.isLoggedIn()) { show('ログインが必要です。LINEのトークからリンクを開いてください'); return; }

    show('3/4 名前を調べています…');
    const data = await callGas({ action: 'name', token: liff.getAccessToken() });

    if (data && data.ok && data.name) {
      show('4/4 ' + data.name + ' さんでフォームを開きます');
      setTimeout(() => location.replace(form.base + '?usp=pp_url&' + form.entry + '=' + encodeURIComponent(data.name)), 1500);
    } else {
      show('名前が見つかりませんでした(名簿にuserIdが無い可能性)。結果: ' + JSON.stringify(data));
    }
  } catch (e) {
    show('エラー: ' + e.message);
  }
})();
