<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォームを開いています</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#444;text-align:center;padding:0 20px;box-sizing:border-box}
  .box{max-width:360px}
  h1{font-size:18px;margin:0 0 14px}
  p{font-size:15px;line-height:1.7;margin:0 0 12px}
  .how{background:#f3f6f4;border-radius:10px;padding:12px 14px;text-align:left;font-size:14px;line-height:1.8}
  .how b{font-size:16px}
  button{margin-top:16px;padding:12px 28px;border:0;border-radius:24px;background:#06c755;color:#fff;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="box" id="box"><p>フォームを開いています…</p></div>
<script>
const LIFF_ID = '2011627592-CPMcSlWW';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzWeTxLPpf93T90hndtyNa64LnxBixU4aDj18Zw9VeUAWY6q0oksia3Fwkud_rgFfqYog/exec';

const FORMS = {
  kintai: {
    base: 'https://docs.google.com/forms/d/e/1FAIpQLSefEEj-YN5fP6YpdniowDxnreOsgDMHRPD1fX3nNCetm7MQIQ/viewform',
    entry: 'entry.938369649'
  },
  labor: {
    base: 'https://docs.google.com/forms/d/e/1FAIpQLScfKA2HP4WtkpuiZ-vEtg2Hq-6K2dZOLPxGjOWIO5FxYCuSlw/viewform',
    entry: 'entry.188643478'
  }
};

const CACHE_KEY = 'prefill_name_v3';
const CACHE_DAYS = 1; // 退職などが反映されるまでの最大日数

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
  ]);
}

// GASはCORSヘッダーを付けられないので、JSONP（scriptタグ）で呼ぶ
function callGas(params) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now();
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 6000);
    function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('load error')); };
    script.src = GAS_URL + '?' + new URLSearchParams(Object.assign({ callback: cb }, params));
    document.body.appendChild(script);
  });
}

function openForm(form, name) {
  const url = name
    ? form.base + '?usp=pp_url&' + form.entry + '=' + encodeURIComponent(name)
    : form.base;
  location.replace(url);
}

function showBlocked(title, bodyHtml) {
  document.title = title;
  document.getElementById('box').innerHTML =
    '<h1>' + title + '</h1>' + bodyHtml +
    '<button id="closeBtn">閉じる</button>';
  document.getElementById('closeBtn').onclick = function () {
    try { liff.closeWindow(); } catch (e) { history.back(); }
  };
}

(async () => {
  // ?f=kintai を、通常の渡され方と、LIFFが入れ替えた liff.state の両方から探す
  const q = new URLSearchParams(location.search);
  let key = q.get('f');
  if (!key && q.get('liff.state')) {
    key = new URLSearchParams(q.get('liff.state').replace(/^\//, '').replace(/^\?/, '')).get('f');
  }
  const form = FORMS[key];
  if (!form) { document.getElementById('box').innerHTML = '<p>フォームが指定されていません</p>'; return; }

  // 2回目以降: 在籍が確認できている名前を覚えていれば、すぐ開く
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && c.name && (Date.now() - c.t) < CACHE_DAYS * 86400000) {
      openForm(form, c.name);
      return;
    }
  } catch (e) {}

  let data = null;
  try {
    await withTimeout(liff.init({ liffId: LIFF_ID }), 8000);
    if (!liff.isLoggedIn()) { liff.login(); return; }
    data = await callGas({ action: 'name', token: liff.getAccessToken() });
  } catch (e) { /* 調べられなかったときは、名前なしでフォームを開く */ }

  if (data && data.ok && data.name) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ name: data.name, t: Date.now() })); } catch (e) {}
    openForm(form, data.name);
    return;
  }

  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}

  if (data && data.reason === 'inactive') {
    showBlocked('在籍が確認できないため<br>申請できません',
      '<p>フォームを閉じてください。</p>');
    return;
  }
  if (data && data.reason === 'unregistered') {
    showBlocked('LINEの登録が必要です',
      '<p>申請の前に、この公式LINEの登録をお願いします。</p>' +
      '<div class="how">トークで次のように送ってください。<br><b>登録 山田花子</b><br>（「登録」と名前の間に空白を入れてください）</div>' +
      '<p style="margin-top:12px">登録できたら、もう一度メニューから開いてください。</p>');
    return;
  }

  // 通信エラーなど: 申請ができなくならないよう、名前なしで開く
  openForm(form, '');
})();
</script>
</body>
</html>
