<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォームを開いています</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#555;text-align:center;padding:0 16px}
</style>
</head>
<body>
<p id="msg">フォームを開いています…</p>
<script>
const LIFF_ID = '2011627592-CPMcSlWW';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzWeTxLPpf93T90hndtyNa64LnxBixU4aDj18Zw9VeUAWY6q0oksia3Fwkud_rgFfqYog/exec';

const FORMS = {
  kintai: {
    base: 'https://docs.google.com/forms/d/e/1FAIpQLSefEEj-YN5fP6YpdniowDxnreOsgDMHRPD1fX3nNCetm7MQIQ/viewform',
    entry: 'entry.938369649'
  },
  labor: {
    base: 'https://docs.google.com/forms/d/e/1FAIpQLScfKA2HP4WtkpuiZ-vEtg2Hq-6K2dZOLPxGjOWIO5FxYCuSlw/viewform',
    entry: 'entry.188643478'
  }
};

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))
  ]);
}

// GASはCORSヘッダーを付けられないので、JSONP（scriptタグ）で呼ぶ
function callGas(params) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now();
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 6000);
    function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('load error')); };
    script.src = GAS_URL + '?' + new URLSearchParams(Object.assign({ callback: cb }, params));
    document.body.appendChild(script);
  });
}

(async () => {
  // ?f=kintai を、通常の渡され方と、LIFFが入れ替えた liff.state の両方から探す
  const q = new URLSearchParams(location.search);
  let key = q.get('f');
  if (!key && q.get('liff.state')) {
    key = new URLSearchParams(q.get('liff.state').replace(/^\//, '').replace(/^\?/, '')).get('f');
  }
  const form = FORMS[key];
  if (!form) { document.getElementById('msg').textContent = 'フォームが指定されていません'; return; }

  let url = form.base; // 名前が取れなかったときは、名前なしでそのままフォームを開く
  try {
    await withTimeout(liff.init({ liffId: LIFF_ID }), 8000);
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const data = await callGas({ action: 'name', token: liff.getAccessToken() });
    if (data && data.ok && data.name) {
      url = form.base + '?usp=pp_url&' + form.entry + '=' + encodeURIComponent(data.name);
    }
  } catch (e) { /* 失敗しても名前なしでフォームは開く */ }
  location.replace(url);
})();
</script>
</body>
</html>
